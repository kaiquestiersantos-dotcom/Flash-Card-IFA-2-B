<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗂️ Flashcards Temáticos (Acessível)</title>
    <!-- Link para o seu arquivo de estilo externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Painel de Acessibilidade -->
    <div class="accessibility-panel">
        <div class="acc-group">
            <span>🔤 Tamanho do Texto:</span>
            <button class="acc-btn" onclick="changeFontSize(1)" title="Aumentar letra">A+</button>
            <button class="acc-btn" onclick="changeFontSize(-1)" title="Diminuir letra">A-</button>
            <button class="acc-btn" onclick="resetFontSize()" title="Resetar letra">Reset</button>
        </div>
        <div class="acc-group">
            <span>👁️ Modo Daltonismo:</span>
            <button class="acc-btn color-btn active" id="btn-normal" onclick="setDaltonism('normal')">Padrão</button>
            <button class="acc-btn color-btn" id="btn-protan" onclick="setDaltonism('protan-deuteran')">Vermelho/Verde</button>
            <button class="acc-btn color-btn" id="btn-tritan" onclick="setDaltonism('tritan')">Azul/Amarelo</button>
            <button class="acc-btn color-btn" id="btn-mono" onclick="setDaltonism('mono')">Monocromático</button>
        </div>
    </div>

    <h1>🗂️ Flashcards Interativos</h1>

    <!-- Filtro de Categorias -->
    <select id="categoryFilter" class="category-select" onchange="changeCategory()">
        <option value="all">Todas as Categorias</option>
        <option value="newton">Disco de Newton</option>
        <option value="vision">Anomalias da Visão</option>
        <option value="world">Curiosidades do Mundo</option>
    </select>

    <!-- Contentor do Card -->
    <div class="container">
        <div class="flashcard" id="card" onclick="flipCard()">
            <div class="card-face card-front">
                <span class="tag" id="cardTag">Categoria</span>
                <p class="question" id="cardQuestion">Pergunta</p>
                <span class="hint">💡 Clique para ver a resposta</span>
            </div>
            <div class="card-face card-back">
                <span class="tag">Resposta</span>
                <p class="answer" id="cardAnswer">Resposta</p>
                <span class="hint">🔄 Clique para voltar à pergunta</span>
            </div>
        </div>
    </div>

    <!-- Botões de Controlo -->
    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">Anterior</button>
        <span id="counter">1 / 12</span>
        <button id="nextBtn" onclick="nextCard()">Próximo</button>
    </div>

    <!-- Link para o seu arquivo de lógica Javascript externo -->
    <script src="main.js"></script>
</body>
</html>
